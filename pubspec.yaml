name: triple_vector_brawler
description: "Reflex-parrying boss-rush duel: read the vector, flick the counter, survive the ladder."
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  audioplayers: ^6.7.1
  bloc: ^9.2.1
  equatable: ^2.0.8
  flame: ^1.37.0
  flame_audio: ^2.12.1
  flame_behaviors: ^1.3.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  fake_async: ^1.3.3
  flame_test: ^2.2.4
  flutter_test:
    sdk: flutter
  mockingjay: ^2.1.0
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.1
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/licenses/poppins/
